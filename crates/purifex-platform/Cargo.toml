[package]
name = "purifex-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
purifex-domain = { path = "../purifex-domain" }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Performance",
    "Wdk_System_SystemInformation",
    # The native interface: window, Direct2D, DirectWrite and WIC (screenshots).
    "Win32_System_Com_StructuredStorage",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    # Windows Update Agent: what Windows Update offers (read only).
    "Win32_System_UpdateAgent",
    # The registry (read only): the installed apps.
    "Win32_System_Registry",
    # ShellExecute: opens a web page in the browser.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
] }

# The vector and matrix types of Direct2D (the `windows` crate uses this one too).
[target.'cfg(windows)'.dependencies.windows-numerics]
version = "0.3"
